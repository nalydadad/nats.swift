name: ci

on:
  push:
    branches: [ main, release/*, feature/* ]
  pull_request:
    branches: [ main, release/* ]

jobs:
  ios:
    runs-on: macos-15
    steps:
    - name: Checkout the code
      uses: actions/checkout@v4
    - name: Build
      run: |
        xcodebuild build -scheme Nats -destination generic/platform=ios
        xcodebuild build -scheme NatsServer -destination generic/platform=ios
  test:
    runs-on: macos-15
    steps:
    - name: Checkout the code
      uses: actions/checkout@v4
    # The integration tests spawn a real server; without it on PATH they crash
    # on a nil unwrap and take the whole test process down with them.
    # Pinned rather than tracking @latest: a floating server version means CI
    # can break overnight with no code change, and the consumer CRUD tests
    # assert on a config check nats-server only performs from 2.13 onwards.
    # Bump deliberately.
    - name: Install nats-server
      run: curl --fail https://binaries.nats.dev/nats-io/nats-server/v2@v2.14.5 | PREFIX='/usr/local/bin' sh
    # Skipped tests need something a GitHub-hosted runner cannot give them:
    # the four TLS ones fail with keychainError(-34018) (errSecMissingEntitlement)
    # because the test process has no usable login keychain, and the DNS one
    # asserts on a lookup error the runner's resolver reports differently.
    - name: Run tests
      run: |
        swift test \
          --skip testMutualTls \
          --skip testTlsFirst \
          --skip testWebsocketTLS \
          --skip testInvalidCertificate \
          --skip testConnectDNSError
  check-linter:
    runs-on: macos-15
    steps:
    - name: Checkout the code
      uses: actions/checkout@v4
    - name: Install swift-format
      run: brew install swift-format
    - name: Run check
      run: swift-format lint --configuration .swift-format -r --strict Sources Tests
