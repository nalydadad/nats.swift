name: ci

on:
  push:
    branches: [ main, release/*, feature/* ]
  pull_request:
    branches: [ main, release/* ]

jobs:
  ios:
    runs-on: macos-15
    steps:
    - name: Checkout the code
      uses: actions/checkout@v4
    - name: Build
      run: |
        xcodebuild build -scheme Nats -destination generic/platform=ios
        xcodebuild build -scheme NatsServer -destination generic/platform=ios
  test:
    runs-on: macos-15
    steps:
    - name: Checkout the code
      uses: actions/checkout@v4
    # The integration tests spawn a real server; without it on PATH they crash
    # on a nil unwrap and take the whole test process down with them.
    - name: Install nats-server
      run: curl --fail https://binaries.nats.dev/nats-io/nats-server/v2@latest | PREFIX='/usr/local/bin' sh
    - name: Run tests
      run: swift test
  check-linter:
    runs-on: macos-15
    steps:
    - name: Checkout the code
      uses: actions/checkout@v4
    - name: Install swift-format
      run: brew install swift-format
    - name: Run check
      run: swift-format lint --configuration .swift-format -r --strict Sources Tests
